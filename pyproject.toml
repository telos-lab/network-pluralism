[project]
name = "network-pluralism"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Titus Puender", email = "titus.puender@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "python-dotenv>=1.2.1",
    "quantlaw>=0.0.7",
    "requests>=2.32.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
]

[project.scripts]
network-pluralism = "network_pluralism:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
